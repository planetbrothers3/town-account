<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>自治会 会計入力フォーム</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      font-size: 40px;
      line-height: 1.5;
    }

    form {
        max-width: 800px;
        margin: 0 auto;
    }

    h1 {
        max-width: 800px;      /* フォームと同じ幅に */
        margin: 0 auto 8px;    /* 上0 / 左右中央 / 下に少し余白 */
        text-align: center;    /* 文字を中央寄せ */
        font-size: 125%;       /* 少し大きめのタイトル */
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 2px;
    }

    small {
      display: block;
      color: #555;
      font-size: 50%;
      line-height: 1.4;
      margin-bottom: 0;
    }

    div {
      margin-bottom: 0;
    }

    input, select {
      background-color: #f0f0f0;
      border: 1px solid #ccc;
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    textarea {
      background-color: #f0f0f0;
      border: 1px solid #ccc;
      width: 100%;
      height: 100px;
      padding: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      margin-top: 16px;
      padding: 10px;
      width: 20%;              /* 画面幅の2割に変更 */
      font-size: 18px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 999px;    /* しっかり丸いボタン */
      cursor: pointer;
      display: block;          
      margin-left: auto;       /* 中央寄せ */
      margin-right: auto;      /* 中央寄せ */
    }

    button:hover {
      background-color: #0069d9;/* マウスを乗せた時だけ少し濃く */
    }

  </style>
</head>
<body>
  <h1>自治会 会計入力フォーム</h1><Br>

  <form id="accountForm">
    <!-- 日付 -->
    <div>
      <label for="date">日付</label>
      <small>支払いや入金があった日を入力してください。</small>
      <input type="date" id="date" name="date" required>
    </div><Br>

    <!-- 区分 -->
    <div>
      <label for="type">区分</label>
      <small>お金が入ったときは「収入」、出たときは「支出」を選びます。</small>
      <select id="type" name="type" required>
        <option value="">選択してください</option>
        <option value="収入">収入</option>
        <option value="支出">支出</option>
      </select>
    </div><Br>

    <!-- 科目 -->
    <div>
      <label for="category">科目</label>
      <small>区分を選ぶと、この取引に一番近い科目を選べます。</small>
      <select id="category" name="category" required>
        <option value="">区分を先に選んでください</option>
      </select>
    </div><Br>

    <!-- 金額 -->
    <div>
      <label for="amount">金額</label>
      <small>円単位で、カンマなしで入力してください。（例：3000）</small>
      <input type="number" id="amount" name="amount" required>
    </div><Br>

    <!-- 内容（メモ） -->
    <div>
      <label for="memo">内容</label>
      <small>誰への支払いか、何の入金かなどを簡単に書いてください。</small>
      <textarea id="memo" name="memo" rows="3"></textarea>
    </div>

    <!-- 送信ボタン -->
    <div>
     <button type="submit" onclick="return confirm('この内容で登録してよろしいですか？');">登録
     </button>
    </div>

  <script>
   // 区分ごとの科目リスト（従来の報告書に合わせたもの）
    const categories = {
      '収入': [
        '自治会費',
        '自治組織助成金',
        '地域活動費',
        '集団回収事業補助金',
        '集団回収売上げ',
        '電柱等敷地利用料',
        '受取利息',
        '雑収入'
      ],
      '支出': [
        '固定資産税',
        '災対連分担金',
        '慶弔費',
        '事務用品費',
        '交通費',
        '通信費',
        '団地案内板更新費',
        '公園等樹木剪定費',
        '雑費'
      ]
    };


    // フォーム要素の取得（HTMLの読み込み後）
    window.addEventListener('DOMContentLoaded', () => {
      const typeSelect = document.getElementById('type');
      const categorySelect = document.getElementById('category');
      const form = document.getElementById('accountForm');

      // ★ここにあなたのApps ScriptのWebアプリURLを入れる
      const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxxju1pUykfbjCPF5hH6yXs-pogDj5TeaU_UIavs7Nt04f1dBipwNefSPPaIuDYKgNi/exec';

      // 区分が変わったときに科目を切り替え
      typeSelect.addEventListener('change', () => {
        const t = typeSelect.value;
        categorySelect.innerHTML = '<option value="">選択してください</option>';
        if (!categories[t]) return;
        categories[t].forEach(name => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          categorySelect.appendChild(opt);
        });
      });

      // フォーム送信時にスプレッドシートへ送る
      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const data = {
          date: document.getElementById('date').value,
          type: document.getElementById('type').value,
          category: document.getElementById('category').value,
          amount: document.getElementById('amount').value,
          memo: document.getElementById('memo').value
        };

        fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        }).then(() => {
          alert('スプレッドシートに送信しました。');
          form.reset();
          categorySelect.innerHTML = '<option value="">区分を先に選んでください</option>';
        }).catch((error) => {
          alert('送信に失敗しました。後でもう一度お試しください。');
          console.error(error);
        });
      });
    });
  </script>
</body>
</html>
